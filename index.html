    <style>
      .boot-screen {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #fff;
      }
      .boot-screen img {
        width: 4rem;
        height: 4rem;
        object-fit: contain;
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Loading 2CaRvN">
        <img src="/brand-mark.png" alt="" width="180" height="262" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
