name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edusphere
          POSTGRES_PASSWORD: edusphere
          POSTGRES_DB: edusphere
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U edusphere -d edusphere"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend-v2
    env:
      NODE_ENV: test
      TEST_DIRECT_DATABASE_URL: postgresql://edusphere:edusphere@localhost:55432/edusphere?schema=public
      APP_DB_PASSWORD: edusphere_test_password
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      CORS_ORIGIN: http://localhost:3000
      SMTP_HOST: ""
      S3_ENDPOINT: http://localhost:59000
      S3_BUCKET: edusphere
      S3_ACCESS_KEY_ID: edusphere
      S3_SECRET_ACCESS_KEY: edusphere-secret
      S3_REGION: auto
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-v2/package-lock.json
      - run: npm ci
      - name: Start test storage
        run: docker run -d --name edusphere-minio-test -p 59000:9000 -e MINIO_ROOT_USER=edusphere -e MINIO_ROOT_PASSWORD=edusphere-secret minio/minio:latest server /data
      - name: Create test bucket
        run: |
          for i in {1..30}; do
            if docker run --rm --network host minio/mc:latest sh -c "mc alias set local http://127.0.0.1:59000 edusphere edusphere-secret && mc mb --ignore-existing local/edusphere"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build